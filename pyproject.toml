[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "airbnb-market-lab"
version = "1.0.0"
description = "Reproducible Inside Airbnb market intelligence pipeline"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "duckdb>=1.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "statsmodels>=0.14,<1", "matplotlib>=3.9,<4", "reportlab>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
airbnb-lab = "airbnb_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
